<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema POS - Birriería</title>
    <style>
        /* Estilos generales */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; }
        
        /* Contenedor de Login */
        #contenedor-login {
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; background-color: #ffffff;
        }
        #contenedor-login input { margin: 10px 0; padding: 10px; width: 250px; font-size: 16px; }
        
        /* Contenedor Principal (oculto al inicio) */
        #contenedor-app { display: none; }
        
        /* Barra de navegación */
        nav { background: #800000; padding: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        nav button { 
            padding: 10px 15px; background: #fff; color: #800000; border: none; 
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        nav button:hover { background: #e0e0e0; }
        
        /* Módulos */
        .modulo { display: none; padding: 20px; }
        .modulo-activo { display: block; } /* Clase para mostrar el módulo */
        
        /* Tablas */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff;}
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #800000; color: white; }
    </style>
</head>
<body>

    <!-- ================= VISTA DE INICIO DE SESIÓN ================= -->
    <div id="contenedor-login">
        <h2>Ingreso al Sistema</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="iniciarSesion()" style="padding: 10px 20px; font-size: 16px; background: #800000; color: white; border: none; cursor: pointer;">Entrar</button>
    </div>

    <!-- ================= APLICACIÓN PRINCIPAL ================= -->
    <div id="contenedor-app">
        <!-- Navegación -->
        <nav>
            <button onclick="mostrarModulo('modulo-pedidos')">Pedidos</button>
            <button onclick="mostrarModulo('modulo-cocina')">Cocina</button>
            <button onclick="mostrarModulo('modulo-caja')">Caja</button>
            <button onclick="mostrarModulo('modulo-productos')">Productos</button>
            <button onclick="mostrarModulo('modulo-usuarios')">Usuarios</button>
            <button onclick="cerrarSesion()" style="margin-left: auto; background: #dc3545; color: white;">Cerrar Sesión</button>
        </nav>

        <!-- 1. Módulo: Pedidos -->
        <div id="modulo-pedidos" class="modulo">
            <h2>Módulo de Pedidos</h2>
            <input type="text" id="cliente-pedido" placeholder="Nombre del cliente" style="padding: 8px;">
            <input type="number" id="total-pedido" placeholder="Total $" style="padding: 8px;">
            <button onclick="guardarPedido()" style="padding: 8px; cursor:pointer;">Registrar Orden</button>
        </div>

        <!-- 2. Módulo: Cocina -->
        <div id="modulo-cocina" class="modulo">
            <h2>Módulo de Cocina</h2>
            <p>Aquí se visualizarán las comandas pendientes.</p>
        </div>

        <!-- 3. Módulo: Caja (Aquí se ven los registros y se hace el corte) -->
        <div id="modulo-caja" class="modulo">
            <h2>Módulo de Caja</h2>
            <button onclick="realizarCorte()" style="padding: 10px; background: #28a745; color: white; border: none; cursor: pointer;">Realizar Corte de Caja</button>
            <button onclick="sincronizarRegistros()" style="padding: 10px; margin-left:10px; cursor:pointer;">Sincronizar Datos</button>
            
            <h3>Ventas Registradas</h3>
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="tabla-registros">
                    <!-- Los registros se inyectarán aquí -->
                </tbody>
            </table>
        </div>

        <!-- 4. Módulo: Productos -->
        <div id="modulo-productos" class="modulo">
            <h2>Módulo de Productos</h2>
            <p>Gestión del inventario y menú.</p>
        </div>

        <!-- 5. Módulo: Usuarios (Ya no se cruza con caja) -->
        <div id="modulo-usuarios" class="modulo">
            <h2>Módulo de Usuarios</h2>
            <p>Gestión de cuentas y accesos del personal.</p>
        </div>
    </div>

    <!-- ================= LÓGICA JAVASCRIPT ================= -->
    <script>
        // PEGA AQUÍ TU URL GENERADA AL IMPLEMENTAR EN GOOGLE APPS SCRIPT
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwtIO1lTtQ_83ZP48Q2zBmyU-IrdfQZuycdtFXjASWALHYLmP3prhll1pTUnF7i3Ajsog/exec"; 

        /* --- CONTROL DE VISTAS Y NAVEGACIÓN --- */
        function iniciarSesion() {
            // Oculta por completo la vista de login para que no estorbe
            document.getElementById('contenedor-login').style.display = 'none';
            // Muestra la aplicación
            document.getElementById('contenedor-app').style.display = 'block';
            
            // Mostrar pedidos por defecto y cargar la base de datos
            mostrarModulo('modulo-pedidos');
            sincronizarRegistros();
        }

        function cerrarSesion() {
            document.getElementById('contenedor-app').style.display = 'none';
            document.getElementById('contenedor-login').style.display = 'flex';
        }

        function mostrarModulo(idModuloDeseado) {
            // Lista de todos los IDs de los módulos
            const modulos = ['modulo-pedidos', 'modulo-cocina', 'modulo-caja', 'modulo-productos', 'modulo-usuarios'];
            
            // Apagar todos
            modulos.forEach(id => {
                let elemento = document.getElementById(id);
                if (elemento) {
                    elemento.style.display = 'none';
                }
            });

            // Encender solo el solicitado
            let moduloActivar = document.getElementById(idModuloDeseado);
            if (moduloActivar) {
                moduloActivar.style.display = 'block';
            }
        }

        /* --- COMUNICACIÓN CON LA BASE DE DATOS (GOOGLE SHEETS) --- */
        
        // 1. Guardar y llenar la base de datos
        function guardarPedido() {
            let cliente = document.getElementById('cliente-pedido').value;
            let total = document.getElementById('total-pedido').value;
            let fecha = new Date().toLocaleString();

            if(!cliente || !total) {
                alert("Por favor completa los campos del pedido.");
                return;
            }

            // Petición al backend
            fetch(URL_WEB_APP, {
                method: 'POST',
                body: JSON.stringify({
                    accion: "insertar",
                    hoja: "Ventas", // Tu pestaña en Sheets debe llamarse "Ventas"
                    datos: [fecha, cliente, total]
                })
            })
            .then(res => res.json())
            .then(respuesta => {
                if(respuesta.estatus === "exito") {
                    alert("¡Registro guardado!");
                    document.getElementById('cliente-pedido').value = '';
                    document.getElementById('total-pedido').value = '';
                    sincronizarRegistros(); // Refrescar la tabla
                }
            })
            .catch(error => alert("Error de conexión al guardar: " + error));
        }

        // 2. Sincronizar y mostrar registros que ya existen
        function sincronizarRegistros() {
            fetch(URL_WEB_APP, {
                method: 'POST',
                body: JSON.stringify({
                    accion: "obtener",
                    hoja: "Ventas"
                })
            })
            .then(res => res.json())
            .then(respuesta => {
                if(respuesta.estatus === "exito") {
                    let cuerpoTabla = document.getElementById('tabla-registros');
                    cuerpoTabla.innerHTML = ''; // Limpiar antes de llenar
                    
                    let datos = respuesta.datos;
                    // Empezamos desde i=1 para saltarnos los encabezados de la fila 1 en Sheets
                    for(let i = 1; i < datos.length; i++) {
                        let fila = document.createElement('tr');
                        fila.innerHTML = `
                            <td>${datos[i][0]}</td>
                            <td>${datos[i][1]}</td>
                            <td>$${datos[i][2]}</td>
                        `;
                        cuerpoTabla.appendChild(fila);
                    }
                }
            })
            .catch(error => console.error("Error sincronizando base de datos:", error));
        }

        // 3. Ejecutar Corte de Caja
        function realizarCorte() {
            if(confirm("¿Estás seguro de que deseas realizar el corte de caja?")) {
                fetch(URL_WEB_APP, {
                    method: 'POST',
                    body: JSON.stringify({
                        accion: "corte_caja",
                        hoja: "Ventas"
                    })
                })
                .then(res => res.json())
                .then(respuesta => {
                    if(respuesta.estatus === "exito") {
                        alert(respuesta.mensaje + "\nTotal calculado: $" + respuesta.total);
                    }
                })
                .catch(error => alert("Error al procesar el corte: " + error));
            }
        }
    </script>
</body>
</html>
